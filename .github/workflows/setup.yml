
name: Setup and Installation

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    name: Set up Python Environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install numpy pandas matplotlib jupyter nbconvert
          fi

      - name: Verify Installation
        run: |
          python -c "import numpy, pandas, matplotlib; print('Dependencies installed successfully!')"

      - name: Validate Notebooks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          notebooks = list(Path(".").rglob("*.ipynb"))
          notebooks = [
              nb for nb in notebooks
              if ".ipynb_checkpoints" not in str(nb)
          ]

          if not notebooks:
              raise SystemExit("No Jupyter notebooks found.")

          for notebook in notebooks:
              with notebook.open(encoding="utf-8") as file:
                  data = json.load(file)

              assert data.get("nbformat", 0) >= 4
              print(f"Valid notebook: {notebook}")

          print(f"Validated {len(notebooks)} notebook(s).")
          PY
