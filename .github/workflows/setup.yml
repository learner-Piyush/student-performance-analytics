
name: Setup and Installation

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-and-test:
    name: Install Dependencies and Execute Notebooks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install numpy pandas matplotlib jupyter nbconvert
          fi

          pip install nbconvert

      - name: Verify Installation
        run: |
          python -c "import numpy, pandas, matplotlib, nbformat, nbconvert; print('All dependencies installed successfully!')"

      - name: Validate and Execute Notebooks
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          from nbconvert.preprocessors import ExecutePreprocessor

          notebooks = [
              path for path in Path(".").rglob("*.ipynb")
              if ".ipynb_checkpoints" not in path.parts
              and ".venv" not in path.parts
              and "venv" not in path.parts
          ]

          if not notebooks:
              raise SystemExit("No Jupyter notebooks found.")

          for path in notebooks:
              print(f"\nExecuting: {path}")

              notebook = nbformat.read(path, as_version=4)

              executor = ExecutePreprocessor(
                  timeout=600,
                  kernel_name="python3",
                  allow_errors=False,
              )

              executor.preprocess(
                  notebook,
                  {"metadata": {"path": str(path.parent.resolve())}},
              )

              print(f"SUCCESS: {path}")

          print(f"\nAll {len(notebooks)} notebook(s) executed successfully!")
          PY
